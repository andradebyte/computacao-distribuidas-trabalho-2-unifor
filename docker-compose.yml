services:

  nginx:
    image: nginx:1.19.0
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/wordpress:/usr/share/nginx/html
      - ./logs:/var/log/nginx/balanceamento
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3

  wordpress1:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.11
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: example
      WORDPRESS_DB_PASSWORD: example
      WORDPRESS_DB_NAME: example
    volumes:
      - ./data/wordpress:/var/www/html
    depends_on:
      - db

  wordpress2:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.12
    environment: *wp-env
    volumes:
      - ./data/wordpress:/var/www/html
    depends_on:
      - db

  wordpress3:
    image: wordpress:5.4.2-php7.2-apache
    restart: always
    networks:
      default:
        ipv4_address: 172.30.0.13
    environment: *wp-env
    volumes:
      - ./data/wordpress:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_DATABASE: example
      MYSQL_USER: example
      MYSQL_PASSWORD: example
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - ./data/db:/var/lib/mysql

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
